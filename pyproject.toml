[project]
name = "ocarandu"
version = "0.1.0"
description = "Detecting and acting on unsupported content in open-LLM summaries of Brazilian public hearings (PublicHearingBR)"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.44",
    "tokenizers>=0.19",
    "torch>=2.13.0",
    "scikit-learn>=1.9.0",
    "nnsight>=0.7.0",
    "accelerate>=1.14.0",
    "spacy>=3.8.14",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
